services:
  database:
    image: postgres:17
    container_name: shiftsync-database

    environment:
      POSTGRES_DB: shiftsync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shiftsync"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: shiftsync-backend

    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/shiftsync

    ports:
      - "8000:8000"

    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data: